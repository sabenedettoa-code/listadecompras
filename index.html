<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#6366f1">
  <title>Mis Listas de Compras</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- Favicon Integrado -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='128' fill='%236366f1'/><g fill='none' stroke='%23ffffff' stroke-width='32' stroke-linecap='round' stroke-linejoin='round'><path d='M192 180 V 140 A 64 64 0 0 1 320 140 V 180'/><path d='M128 180 H 384 L 360 400 A 24 24 0 0 1 336 424 H 176 A 24 24 0 0 1 152 400 Z' fill='%23ffffff' fill-opacity='0.2'/><path d='M220 290 L 248 318 L 300 260' stroke-width='36'/></g></svg>">

  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --danger: #ef4444;
      --success: #10b981;
      --border: #cbd5e1;
      --tab-bg: #f1f5f9;
      --shadow: rgba(0, 0, 0, 0.05);
      --font-scale: 1;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --card-bg: #1e293b;
        --text: #f8fafc;
        --text-muted: #94a3b8;
        --border: #475569;
        --tab-bg: #0f172a;
        --shadow: rgba(0, 0, 0, 0.3);
      }
    }

    * { box-sizing: border-box; }

    html {
      font-size: calc(16px * var(--font-scale));
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 16px;
      margin: 0;
      transition: background-color 0.3s, color 0.3s;
    }

    .container {
      background: var(--card-bg);
      width: 100%;
      max-width: 460px;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 10px 30px var(--shadow);
      position: relative;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .app-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin: 0;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* CONTROLES DE ACCESIBILIDAD */
    .font-size-controls {
      display: flex;
      background-color: var(--tab-bg);
      border: 2px solid var(--border);
      border-radius: 20px;
      padding: 2px;
    }

    .btn-font {
      background: none;
      border: none;
      color: var(--text);
      font-weight: 700;
      font-size: 0.9rem;
      min-width: 38px;
      min-height: 38px;
      cursor: pointer;
      border-radius: 12px;
      transition: background 0.2s;
    }

    .btn-font:hover { background-color: var(--border); }

    .btn-help {
      background-color: var(--tab-bg);
      border: 2px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      min-height: 42px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-help:hover { background-color: var(--border); }

    .nav-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
      background-color: var(--tab-bg);
      padding: 4px;
      border-radius: 14px;
    }

    .nav-btn {
      flex: 1;
      background: none;
      border: none;
      padding: 12px 8px;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 10px;
      transition: all 0.2s ease;
      min-height: 48px;
    }

    .nav-btn.active {
      color: var(--primary);
      background-color: var(--card-bg);
      box-shadow: 0 2px 6px var(--shadow);
    }

    .input-container {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px;
      border: 2px solid var(--border);
      background-color: var(--card-bg);
      color: var(--text);
      border-radius: 12px;
      font-size: 1rem;
      outline: none;
      min-width: 0;
      min-height: 48px;
    }

    input[type="number"] {
      padding: 12px 6px;
      border: 2px solid var(--border);
      background-color: var(--card-bg);
      color: var(--text);
      border-radius: 12px;
      font-size: 1rem;
      text-align: center;
      outline: none;
      min-height: 48px;
    }

    .qty-input { width: 48px; }
    .price-input { width: 90px; }

    input:focus { border-color: var(--primary); }

    .btn-main {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px 16px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      min-height: 48px;
      min-width: 48px;
    }

    .btn-main:hover { background-color: var(--primary-hover); }

    /* BOTÓN MICRÓFONO */
    .btn-mic {
      background-color: var(--tab-bg);
      color: var(--text);
      border: 2px solid var(--border);
      padding: 12px;
      border-radius: 12px;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      min-width: 48px;
      transition: all 0.2s;
    }

    .btn-mic:hover { border-color: var(--primary); }

    .btn-mic.listening {
      background-color: #fee2e2;
      border-color: var(--danger);
      color: var(--danger);
      animation: pulseMic 1.2s infinite;
    }

    @keyframes pulseMic {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    .action-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .btn-sec {
      flex: 1;
      background-color: var(--tab-bg);
      color: var(--text);
      border: 2px solid var(--border);
      padding: 10px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 46px;
      transition: background 0.2s;
    }

    .btn-sec:hover { background-color: var(--border); }
    .btn-sec.active-mode {
      background-color: #dcfce7;
      border-color: var(--success);
      color: #15803d;
    }

    .btn-share {
      background-color: #25d366;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      min-height: 44px;
    }

    .progress-container {
      margin-bottom: 16px;
      background: var(--tab-bg);
      padding: 12px;
      border-radius: 12px;
      border: 2px solid var(--border);
    }

    .progress-text {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }

    .progress-track {
      height: 10px;
      background-color: var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background-color: var(--success);
      width: 0%;
      transition: width 0.3s ease;
    }

    .list-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 14px;
      margin-bottom: 10px;
      cursor: pointer;
      min-height: 56px;
    }

    .list-info h4 { margin: 0 0 4px 0; font-size: 1.05rem; }
    .list-info p { margin: 0; font-size: 0.85rem; color: var(--text-muted); }

    .category-header {
      font-size: 0.88rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--primary);
      margin: 20px 0 10px 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .category-title {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .category-nav-btns { display: flex; gap: 4px; }

    .btn-cat-order {
      background: var(--tab-bg);
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
      font-size: 0.8rem;
      padding: 4px 8px;
      border-radius: 6px;
      min-height: 36px;
      min-width: 36px;
    }

    ul { list-style: none; padding: 0; margin: 0; }

    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      background: var(--card-bg);
      border-radius: 12px;
      margin-bottom: 10px;
      border: 2px solid var(--border);
      min-height: 54px;
    }

    .item-details { flex: 1; min-width: 0; cursor: pointer; }
    .item-name { font-weight: 600; font-size: 1rem; word-break: break-word; }
    .item-subtext { font-size: 0.82rem; color: var(--text-muted); margin-top: 2px; }

    .comprado { text-decoration: line-through; color: var(--text-muted); opacity: 0.5; }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--tab-bg);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .btn-qty {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
      font-weight: bold;
      padding: 4px;
      min-width: 36px;
      min-height: 36px;
      border-radius: 6px;
      font-size: 1rem;
    }

    .btn-delete {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.2rem;
      min-width: 40px;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-delete:hover { color: var(--danger); }

    .inline-price {
      width: 75px;
      padding: 6px 8px;
      border: 1px solid var(--border);
      background-color: var(--card-bg);
      color: var(--text);
      border-radius: 8px;
      font-size: 0.85rem;
      text-align: right;
      min-height: 40px;
    }

    .budget-summary {
      margin-top: 20px;
      padding: 14px 16px;
      background: var(--tab-bg);
      border-radius: 14px;
      border: 2px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .budget-item { text-align: center; }
    .budget-label { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 2px; }
    .budget-val { font-weight: 800; font-size: 1rem; }
    .budget-val.spent { color: var(--success); }

    .sub-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
    .sub-btn {
      background: none;
      border: 1px solid transparent;
      font-size: 0.88rem;
      color: var(--text-muted);
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 8px;
      min-height: 42px;
      font-weight: 600;
    }
    .sub-btn.active {
      background: var(--tab-bg);
      border-color: var(--border);
      color: var(--text);
      font-weight: 700;
    }

    .header-active { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 8px; }
    .btn-back { background: none; border: none; color: var(--primary); font-weight: 700; cursor: pointer; padding: 6px 0; font-size: 0.95rem; }
    .empty-msg { text-align: center; color: var(--text-muted); font-size: 0.95rem; margin-top: 30px; }

    /* TOAST Y NOTIFICACIÓN DESHACER */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background-color: var(--text);
      color: var(--card-bg);
      padding: 12px 20px;
      border-radius: 30px;
      font-size: 0.9rem;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    .btn-undo {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }

    .tutorial-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .tutorial-overlay.active { opacity: 1; pointer-events: auto; }

    .tutorial-card {
      background: var(--card-bg);
      color: var(--text);
      width: 100%;
      max-width: 380px;
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      text-align: center;
    }

    .tutorial-icon { font-size: 3rem; margin-bottom: 12px; }
    .tutorial-card h3 { margin: 0 0 10px 0; font-size: 1.25rem; }
    .tutorial-card p { font-size: 0.98rem; line-height: 1.5; color: var(--text-muted); margin: 0 0 20px 0; }
    .tutorial-dots { display: flex; justify-content: center; gap: 6px; margin-bottom: 20px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); }
    .dot.active { background: var(--primary); width: 20px; border-radius: 4px; }
    .tutorial-actions { display: flex; gap: 10px; }

    .btn-tut {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      border: none;
      min-height: 48px;
    }

    .btn-tut.prev { background-color: var(--tab-bg); color: var(--text); border: 1px solid var(--border); }
    .btn-tut.next { background-color: var(--primary); color: white; }
  </style>
</head>
<body>

  <div class="container">
    
    <div class="header-top">
      <h1 class="app-title">🛒 Mis Listas</h1>
      <div class="header-controls">
        <div class="font-size-controls" title="Ajustar letra">
          <button class="btn-font" onclick="cambiarTamanoLetra(-0.15)">A-</button>
          <button class="btn-font" onclick="cambiarTamanoLetra(0.15)">A+</button>
        </div>
        <button class="btn-help" onclick="abrirTutorial()">❓ Ayuda</button>
      </div>
    </div>

    <div class="nav-tabs">
      <button class="nav-btn active" id="navMisListas" onclick="verSeccion('mis-listas')">📋 Mis Listas</button>
      <button class="nav-btn" id="navListaActiva" onclick="verSeccion('lista-activa')">🛒 Lista Actual</button>
    </div>

    <!-- SECCIÓN 1: MIS LISTAS -->
    <div id="secMisListas">
      <div class="input-container">
        <input type="text" id="nombreNuevaLista" placeholder="Ej: Mercado mensual, Feria...">
        <button class="btn-main" onclick="crearNuevaLista()">Crear</button>
      </div>

      <div class="action-bar">
        <button class="btn-sec" onclick="exportarBackup()">💾 Respaldar</button>
        <button class="btn-sec" onclick="document.getElementById('importFileInput').click()">📂 Cargar</button>
        <input type="file" id="importFileInput" style="display:none" accept=".json" onchange="importarBackup(event)">
      </div>

      <div id="contenedorListas"></div>
    </div>

    <!-- SECCIÓN 2: DETALLE DE LISTA ACTIVA -->
    <div id="secListaActiva" style="display: none;">
      <div class="header-active">
        <button class="btn-back" onclick="verSeccion('mis-listas')">← Listas</button>
        <h3 id="tituloListaActiva" style="margin: 0; flex: 1; text-align: center;">Lista</h3>
        <button class="btn-share" onclick="compartirListaActiva()">📲 Compartir</button>
      </div>

      <div class="progress-container">
        <div class="progress-text">
          <span id="txtProgresoEstado">0 de 0 productos en el carro</span>
          <span id="txtProgresoPorcentaje">0%</span>
        </div>
        <div class="progress-track">
          <div id="fillProgreso" class="progress-fill"></div>
        </div>
      </div>

      <!-- Formulario con Micrófono -->
      <div class="input-container">
        <input type="number" id="itemQty" class="qty-input" value="1" min="1" max="99" title="Cantidad">
        <input type="text" id="itemInput" list="sugerenciasGenericasChilenas" placeholder="Producto...">
        <button id="btnMic" class="btn-mic" onclick="activarDictadoVoz()" title="Dictar por voz">🎤</button>
        
        <datalist id="sugerenciasGenericasChilenas">
          <option value="Marraqueta"></option>
          <option value="Hallulla"></option>
          <option value="Pan de molde"></option>
          <option value="Palta hass"></option>
          <option value="Tomate"></option>
          <option value="Leche entera"></option>
          <option value="Leche descremada"></option>
          <option value="Huevos"></option>
          <option value="Queso gauda"></option>
          <option value="Quesillo"></option>
          <option value="Mantequilla"></option>
          <option value="Manjar"></option>
          <option value="Yogur"></option>
          <option value="Carne molida"></option>
          <option value="Lomo vetado"></option>
          <option value="Sobrecostilla"></option>
          <option value="Vienesas"></option>
          <option value="Longaniza"></option>
          <option value="Arroz"></option>
          <option value="Tallarines"></option>
          <option value="Salsa de tomate"></option>
          <option value="Aceite de maravilla"></option>
          <option value="Jurel en tarro"></option>
          <option value="Atún en lata"></option>
          <option value="Detergente"></option>
          <option value="Cloro gel"></option>
          <option value="Lavaloza"></option>
          <option value="Toalla nova"></option>
          <option value="Papel higiénico"></option>
          <option value="Limpiavidrios"></option>
          <option value="Limpiapisos"></option>
          <option value="Agua mineral"></option>
          <option value="Bebida"></option>
          <option value="Cerveza"></option>
          <option value="Vino tinto"></option>
        </datalist>
        <input type="number" id="itemPrice" class="price-input" placeholder="$ CLP" min="0" step="1" title="Precio CLP">
        <button class="btn-main" onclick="agregarProducto()">+</button>
      </div>

      <!-- Barra de Acciones de Accesibilidad Avanzadas -->
      <div class="action-bar">
        <button id="btnWakeLock" class="btn-sec" onclick="togglePantallaEncendida()">💡 Pantalla Encendida</button>
        <button class="btn-sec" onclick="leerListaEnVozAlta()">🔊 Leer Lista</button>
        <button class="btn-sec" onclick="desmarcarTodos()">🔄 Reutilizar</button>
        <button class="btn-sec" onclick="copiarComoTexto()">📝 Copiar</button>
      </div>

      <div class="sub-tabs">
        <button class="sub-btn active" id="subTabPendientes" onclick="cambiarFiltro('pendientes')">Por comprar</button>
        <button class="sub-btn" id="subTabComprados" onclick="cambiarFiltro('comprados')">Comprados</button>
      </div>

      <div id="contenedorProductosCategorizados"></div>

      <div class="budget-summary" id="panelPresupuesto">
        <div class="budget-item">
          <div class="budget-label">Llevas gastado</div>
          <div class="budget-val spent" id="valGastado">$0 CLP</div>
        </div>
        <div style="height: 28px; width: 2px; background: var(--border);"></div>
        <div class="budget-item">
          <div class="budget-label">Total Estimado</div>
          <div class="budget-val" id="valTotal">$0 CLP</div>
        </div>
      </div>
    </div>

  </div>

  <div id="toast" class="toast">
    <span id="toastMsg">Mensaje del sistema</span>
    <button id="btnUndoToast" class="btn-undo" onclick="deshacerEliminacion()" style="display:none;">↩️ Deshacer</button>
  </div>

  <!-- MODAL TUTORIAL INTERACTIVO -->
  <div id="tutorialOverlay" class="tutorial-overlay">
    <div class="tutorial-card">
      <div id="tutIcon" class="tutorial-icon">👋</div>
      <h3 id="tutTitle">¡Bienvenido!</h3>
      <p id="tutDesc">Esta aplicación te ayudará a organizar tus compras del supermercado de forma muy fácil.</p>
      
      <div class="tutorial-dots">
        <span class="dot active" id="dot0"></span>
        <span class="dot" id="dot1"></span>
        <span class="dot" id="dot2"></span>
        <span class="dot" id="dot3"></span>
      </div>

      <div class="tutorial-actions">
        <button id="btnTutPrev" class="btn-tut prev" onclick="pasoTutorial(-1)" style="display:none;">Anterior</button>
        <button id="btnTutNext" class="btn-tut next" onclick="pasoTutorial(1)">Siguiente</button>
      </div>
    </div>
  </div>

  <script>
    let coleccionListas = [];
    let idListaActiva = null;
    let filtroProductos = 'pendientes';
    let pasoActualTutorial = 0;
    let esEscuchandoVoz = false;
    let escalaFuenteActual = 1;
    let wakeLockSentinel = null;
    let ultimoProductoEliminado = null;

    const pasosTutorialData = [
      {
        icon: '👋',
        title: '¡Bienvenido a tu Lista!',
        desc: 'Te enseñamos en pocos pasos cómo usar tu nueva lista de compras para el supermercado.'
      },
      {
        icon: '📝',
        title: '1. Crea tu Lista',
        desc: 'Escribe el nombre que quieras (ej: "Jumbo" o "Feria") en la casilla de arriba y presiona el botón "Crear".'
      },
      {
        icon: '🎤',
        title: '2. Dicta o Escribe',

    function clasificarProducto(texto) {
      for (const cat of CATEGORIAS) {
        if (cat.id !== 'varios' && cat.regex.test(texto)) return cat;
      }
      return CATEGORIAS.find(c => c.id === 'varios');

    /* --- VIBRACIÓN HÁPTICA PARA ADULTOS MAYORES --- */
    function vibrarConfirmacion() {
      if (navigator.vibrate) {
        navigator.vibrate(35); // impulso corto
      }
    }

    function mostrarToast(mensaje, conUndo = false) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      const btnUndo = document.getElementById('btnUndoToast');

      toastMsg.textContent = mensaje;
      btnUndo.style.display = conUndo ? 'inline-block' : 'none';

      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 4000);
    }

    document.addEventListener('DOMContentLoaded', () => {
      cargarTamanoLetra();
      cargarStorage();
      cargarOrdenCategorias();
      procesarListaRecibidaPorURL();
      renderizarListas();
      comprobarTutorialPrimeraVez();
    });

    /* --- MANTENER PANTALLA ENCENDIDA (WAKE LOCK) --- */
    async function togglePantallaEncendida() {
      vibrarConfirmacion();
      const btn = document.getElementById('btnWakeLock');

      if ('wakeLock' in navigator) {
        try {
          if (!wakeLockSentinel) {
            wakeLockSentinel = await navigator.wakeLock.request('screen');
            btn.classList.add('active-mode');
            btn.textContent = '💡 Pantalla Encendida (ON)';
            mostrarToast("💡 Pantalla fijada: No se apagará mientras compras");
          } else {
            await wakeLockSentinel.release();
            wakeLockSentinel = null;
            btn.classList.remove('active-mode');
            btn.textContent = '💡 Pantalla Normal';
            mostrarToast("💡 Pantalla devuelta a modo normal");
          }
        } catch (err) {
          mostrarToast("⚠️ No se pudo bloquear el apague de pantalla");
        }
      } else {
        mostrarToast("⚠️ Tu navegador no admite bloqueo de apagado");
      }
    }

    /* --- LECTURA EN VOZ ALTA (TEXT-TO-SPEECH) --- */
    function leerListaEnVozAlta() {
      vibrarConfirmacion();
      const lista = coleccionListas.find(l => l.id === idListaActiva);
      if (!lista) return;

      const pendientes = lista.items.filter(i => !i.comprado);
      if (pendientes.length === 0) {
        mostrarToast("🔊 No tienes productos pendientes por comprar");
        return;
      }

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // Detener lecturas previas

        let texto = `Tienes pendiente comprar ${pendientes.length} productos: `;
        pendientes.forEach(i => {
          texto += `${i.cantidad} ${i.texto}, `;
        });

        const utterance = new SpeechSynthesisUtterance(texto);
        utterance.lang = 'es-CL';
        utterance.rate = 0.9; // Velocidad pausada amigable
        window.speechSynthesis.speak(utterance);
        mostrarToast("🔊 Leyendo lista en voz alta...");
      } else {
        mostrarToast("⚠️ Tu dispositivo no admite lectura en voz alta");
      }
    }

    /* --- CAMBIO DE TAMAÑO DE FUENTE --- */
    function cambiarTamanoLetra(delta) {
      vibrarConfirmacion();
      escalaFuenteActual = Math.min(Math.max(0.85, escalaFuenteActual + delta), 1.45);
      document.documentElement.style.setProperty('--font-scale', escalaFuenteActual);
      localStorage.setItem('tamanoFuente_v1', escalaFuenteActual);
    }

    function cargarTamanoLetra() {
      const guardada = localStorage.getItem('tamanoFuente_v1');
      if (guardada) {
        escalaFuenteActual = parseFloat(guardada);
        document.documentElement.style.setProperty('--font-scale', escalaFuenteActual);
      }
    }

    /* --- DICTADO POR VOZ --- */
    function activarDictadoVoz() {
      vibrarConfirmacion();
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        mostrarToast("⚠️ Tu navegador no soporta dictado por voz");
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = 'es-CL';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      const btnMic = document.getElementById('btnMic');
      const input = document.getElementById('itemInput');

      if (esEscuchandoVoz) {
        recognition.stop();
        return;
      }

      recognition.start();
      esEscuchandoVoz = true;
      btnMic.classList.add('listening');
      btnMic.textContent = '🔴';
      mostrarToast("🎙️ Habla ahora (ej: 'Marraqueta')...");

      recognition.onresult = function(event) {
        const textoDictado = event.results[0][0].transcript;
        if (textoDictado) {
          input.value = textoDictado;
          mostrarToast(`🗣️ Entendido: "${textoDictado}"`);
        }
      };

      recognition.onspeechend = function() { recognition.stop(); };
      recognition.onend = function() {
        esEscuchandoVoz = false;
        btnMic.classList.remove('listening');
        btnMic.textContent = '🎤';
      };
      recognition.onerror = function(event) {
        esEscuchandoVoz = false;
        btnMic.classList.remove('listening');
        btnMic.textContent = '🎤';
        if (event.error !== 'no-speech') {
          mostrarToast("⚠️ No se pudo entender la voz");
        }
      };
    }

    function comprobarTutorialPrimeraVez() {
      const visto = localStorage.getItem('tutorialVisto_v1');
      if (!visto) abrirTutorial();
    }

    function abrirTutorial() {
      vibrarConfirmacion();
      pasoActualTutorial = 0;
      actualizarTutorialUI();
      document.getElementById('tutorialOverlay').classList.add('active');
    }

    function cerrarTutorial() {
      vibrarConfirmacion();
      document.getElementById('tutorialOverlay').classList.remove('active');
      localStorage.setItem('tutorialVisto_v1', 'true');
    }

    function pasoTutorial(dir) {
      vibrarConfirmacion();
      pasoActualTutorial += dir;
      if (pasoActualTutorial < 0) pasoActualTutorial = 0;
      if (pasoActualTutorial >= pasosTutorialData.length) {
        cerrarTutorial();
        return;
      }
      actualizarTutorialUI();
    }

    function actualizarTutorialUI() {
      const data = pasosTutorialData[pasoActualTutorial];
      document.getElementById('tutIcon').textContent = data.icon;
      document.getElementById('tutTitle').textContent = data.title;
      document.getElementById('tutDesc').textContent = data.desc;

      const btnPrev = document.getElementById('btnTutPrev');
      const btnNext = document.getElementById('btnTutNext');

      btnPrev.style.display = pasoActualTutorial === 0 ? 'none' : 'block';
      btnNext.textContent = pasoActualTutorial === pasosTutorialData.length - 1 ? '¡Entendido!' : 'Siguiente';

      for (let i = 0; i < 4; i++) {
        const dot = document.getElementById(`dot${i}`);
        if (dot) dot.classList.toggle('active', i === pasoActualTutorial);
      }
    }

    function verSeccion(seccion) {
      vibrarConfirmacion();
      const secMisListas = document.getElementById('secMisListas');
      const secListaActiva = document.getElementById('secListaActiva');
      const navMisListas = document.getElementById('navMisListas');
      const navListaActiva = document.getElementById('navListaActiva');

      if (seccion === 'mis-listas') {
        secMisListas.style.display = 'block';
        secListaActiva.style.display = 'none';
        navMisListas.classList.add('active');
        navListaActiva.classList.remove('active');
        renderizarListas();
      } else {
        if (coleccionListas.length === 0) {
          mostrarToast("⚠️ Primero debes crear una lista de compras");
          return;
        }

        if (!idListaActiva) {
          idListaActiva = coleccionListas[0].id;
        }

        secMisListas.style.display = 'none';
        secListaActiva.style.display = 'block';
        navMisListas.classList.remove('active');
        navListaActiva.classList.add('active');
        renderizarProductos();
      }
    }

    function exportarBackup() {
      vibrarConfirmacion();
      if (coleccionListas.length === 0) {
        mostrarToast("⚠️ No hay listas para exportar");
        return;
      }
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(coleccionListas));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `mis_listas_compras_${Date.now()}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      mostrarToast("💾 Respaldo guardado con éxito");
    }

    function importarBackup(e) {
      vibrarConfirmacion();
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const importadas = JSON.parse(evt.target.result);
          if (Array.isArray(importadas)) {
            coleccionListas = importadas;
            guardarStorage();
            renderizarListas();
            mostrarToast("📂 Respaldo cargado correctamente");
          } else { throw new Error(); }
        } catch (err) {
          mostrarToast("⚠️ Archivo de respaldo no válido");
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    }

    function moverCategoria(index, direccion) {
      vibrarConfirmacion();
      const nuevoIndex = index + direccion;
      if (nuevoIndex < 0 || nuevoIndex >= CATEGORIAS.length) return;
      
      const temp = CATEGORIAS[index];
      CATEGORIAS[index] = CATEGORIAS[nuevoIndex];
      CATEGORIAS[nuevoIndex] = temp;

      guardarOrdenCategorias();
      renderizarProductos();
    }

    function guardarOrdenCategorias() {
      const ordenIds = CATEGORIAS.map(c => c.id);
      localStorage.setItem('ordenPasillos_v1', JSON.stringify(ordenIds));
    }

    function cargarOrdenCategorias() {
      const datos = localStorage.getItem('ordenPasillos_v1');
      if (datos) {
        try {
          const ordenIds = JSON.parse(datos);
          CATEGORIAS.sort((a, b) => ordenIds.indexOf(a.id) - ordenIds.indexOf(b.id));
        } catch (e) {}
      }
    }

    function desmarcarTodos() {
      vibrarConfirmacion();
      const lista = coleccionListas.find(l => l.id === idListaActiva);
      if (!lista || lista.items.length === 0) return;

      lista.items.forEach(i => i.comprado = false);
      guardarStorage();
      renderizarProductos();
      mostrarToast("🔄 Lista desmarcada para una nueva compra");
    }

    async function copiarComoTexto() {
      vibrarConfirmacion();
      const lista = coleccionListas.find(l => l.id === idListaActiva);
      if (!lista || lista.items.length === 0) return;

      let textoPlano = `🛒 *Lista: ${lista.nombre}*\n\n`;
      let totalEstimado = 0;

      lista.items.forEach(item => {
        const subtotal = item.cantidad * (item.precio || 0);
        totalEstimado += subtotal;
        const precioTxt = subtotal > 0 ? ` (${formatoCLP.format(subtotal)})` : '';
        const check = item.comprado ? '✅' : '▫️';
        textoPlano += `${check} ${item.cantidad}x ${item.texto}${precioTxt}\n`;
      });

      if (totalEstimado > 0) {
        textoPlano += `\n*Total estimado: ${formatoCLP.format(totalEstimado)}*`;
      }

      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(textoPlano);
          mostrarToast("📝 Lista copiada al portapapeles");
        } else { throw new Error(); }
      } catch (err) {
        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(textoPlano)}`, '_blank');
      }
    }

    async function compartirListaActiva() {
      vibrarConfirmacion();
      const lista = coleccionListas.find(l => l.id === idListaActiva);
      if (!lista) return;

      try {
        const datosJSON = JSON.stringify({
          nombre: lista.nombre,
          items: lista.items.map(i => ({ t: i.texto, c: i.cantidad, p: i.precio || 0, k: i.comprado }))
        });

        const datosBase64 = btoa(encodeURIComponent(datosJSON));
        const urlCompartida = `${window.location.origin}${window.location.pathname}?l=${datosBase64}`;

        if (navigator.share) {
          try {
            await navigator.share({
              title: `Lista: ${lista.nombre}`,
              text: `Te comparto la lista de compras "${lista.nombre}":`,
              url: urlCompartida
            });
            return;
          } catch (e) {
            if (e.name === 'AbortError') return;
          }
        }
        await copiarEnlace(urlCompartida, lista.nombre);
      } catch (error) {
        mostrarToast("⚠️ Error al compartir");
      }
    }

    async function copiarEnlace(url, nombreLista) {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(url);
          mostrarToast(`📋 ¡Enlace copiado!`);
        } else { throw new Error(); }
      } catch (err) {
        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(`Lista "${nombreLista}": ${url}`)}`, '_blank');
      }
    }

    function procesarListaRecibidaPorURL() {
      const urlParams = new URLSearchParams(window.location.search);
      const datosBase64 = urlParams.get('l') || urlParams.get('listaShared');

      if (datosBase64) {
        try {
          let datos = JSON.parse(urlParams.get('l') ? decodeURIComponent(atob(datosBase64)) : decodeURIComponent(datosBase64));
          if (datos && datos.nombre) {
            const itemsRestaurados = (datos.items || []).map(i => {
              const catInfo = clasificarProducto(i.t || i.texto);
              return {
                id: Date.now() + Math.random(),
                texto: i.t || i.texto,
                cantidad: i.c || i.cantidad || 1,
                precio: Math.round(i.p || i.precio || 0),
                categoriaId: catInfo.id,
                icono: catInfo.icono,
                comprado: i.k || i.comprado || false
              };
            });

            const nuevaLista = { id: Date.now(), nombre: `${datos.nombre} (Compartida)`, items: itemsRestaurados };
            coleccionListas.push(nuevaLista);
            guardarStorage();
            window.history.replaceState({}, document.title, window.location.pathname);
            abrirLista(nuevaLista.id);
            mostrarToast(`🎉 ¡Lista "${datos.nombre}" importada!`);
          }
        } catch (e) { console.error(e); }
      }
    }

    function crearNuevaLista() {
      vibrarConfirmacion();
      const input = document.getElementById('nombreNuevaLista');
      const nombre = input.value.trim();
      if (!nombre) return;

      const nuevaLista = { id: Date.now(), nombre: nombre, items: [] };
      coleccionListas.push(nuevaLista);
      guardarStorage();
      input.value = "";
      abrirLista(nuevaLista.id);
      mostrarToast(`✨ Lista creada`);
    }

    function abrirLista(id) {
      vibrarConfirmacion();
      idListaActiva = id;
      verSeccion('lista-activa');
    }

    function eliminarLista(e, id) {
      e.stopPropagation();
      vibrarConfirmacion();
      coleccionListas = coleccionListas.filter(l => l.id !== id);
      if (idListaActiva === id) idListaActiva = null;
      guardarStorage();
      renderizarListas();
      mostrarToast(`🗑️ Lista eliminada`);
    }

    function renderizarListas() {
      const contenedor = document.getElementById('contenedorListas');
      contenedor.innerHTML = "";
      if (coleccionListas.length === 0) {
        contenedor.innerHTML = '<p class="empty-msg">No tienes listas creadas. ¡Crea una arriba!</p>';
        return;
      }
      coleccionListas.forEach(lista => {
        const pendientes = lista.items.filter(i => !i.comprado).length;
        const div = document.createElement('div');
        div.className = 'list-card';
        div.onclick = () => abrirLista(lista.id);
        div.innerHTML = `
          <div class="list-info">
            <h4>📌 ${escapeHtml(lista.nombre)}</h4>
            <p>${pendientes} pendientes de ${lista.items.length} productos</p>
          </div>
          <button class="btn-delete" onclick="eliminarLista(event, ${lista.id})">🗑️</button>
        `;
        contenedor.appendChild(div);
      });
    }

    function agregarProducto() {
      if (!idListaActiva) return;
      vibrarConfirmacion();

      const input = document.getElementById('itemInput');
      const qtyInput = document.getElementById('itemQty');
      const priceInput = document.getElementById('itemPrice');
      
      const texto = input.value.trim();
      const cantidad = parseInt(qtyInput.value) || 1;
      const precio = Math.round(parseFloat(priceInput.value) || 0);

      if (!texto) return;

      const lista = coleccionListas.find(l => l.id === idListaActiva);
      if (lista) {
        const catInfo = clasificarProducto(texto);
        lista.items.push({
          id: Date.now(),
          texto: texto,
          cantidad: cantidad,
          precio: precio,
          categoriaId: catInfo.id,
          icono: catInfo.icono,
          comprado: false
        });

        guardarStorage();
        renderizarProductos();
        input.value = "";
        qtyInput.value = "1";
        priceInput.value = "";
        input.focus();
      }
    }

    function cambiarEstadoProducto(prodId) {
      vibrarConfirmacion();
      const lista = coleccionListas.find(l => l.id === idListaActiva);
      if (lista) {
        const prod = lista.items.find(i => i.id === prodId);
        if (prod) prod.comprado = !prod.comprado;
        guardarStorage();
        renderizarProductos();
      }
    }

    function cambiarCantidadProducto(prodId, cambio) {
      vibrarConfirmacion();
      const lista = coleccionListas.find(l => l.id === idListaActiva);
      if (lista) {
        const prod = lista.items.find(i => i.id === prodId);
        if (prod) {
          prod.cantidad = Math.max(1, prod.cantidad + cambio);
          guardarStorage();
          renderizarProductos();
        }
      }
    }

    function actualizarPrecioProducto(prodId, nuevoPrecio) {
      const lista = coleccionListas.find(l => l.id === idListaActiva);
      if (lista) {
        const prod = lista.items.find(i => i.id === prodId);
        if (prod) {
          prod.precio = Math.max(0, Math.round(parseFloat(nuevoPrecio) || 0));
          guardarStorage();
          renderizarProductos();
        }
      }
    }

    /* --- ELIMINAR CON DESHACER (PREVENCIÓN DE ERRORES) --- */
    function eliminarProducto(prodId) {
      vibrarConfirmacion();
      const lista = coleccionListas.find(l => l.id === idListaActiva);
      if (lista) {
        const prodIndex = lista.items.findIndex(i => i.id === prodId);
        if (prodIndex !== -1) {
          ultimoProductoEliminado = {
            listaId: idListaActiva,
            item: lista.items[prodIndex],
            index: prodIndex
          };

          lista.items.splice(prodIndex, 1);
          guardarStorage();
          renderizarProductos();
          mostrarToast(`🗑️ "${ultimoProductoEliminado.item.texto}" borrado`, true);
        }
      }
    }

    function deshacerEliminacion() {
      vibrarConfirmacion();
      if (!ultimoProductoEliminado) return;

      const lista = coleccionListas.find(l => l.id === ultimoProductoEliminado.listaId);
      if (lista) {
        lista.items.splice(ultimoProductoEliminado.index, 0, ultimoProductoEliminado.item);
        guardarStorage();
        renderizarProductos();
        mostrarToast(`↩️ Producto restaurado`);
        ultimoProductoEliminado = null;
      }
    }

    function cambiarFiltro(filtro) {
      vibrarConfirmacion();
      filtroProductos = filtro;
      document.getElementById('subTabPendientes').classList.toggle('active', filtro === 'pendientes');
      document.getElementById('subTabComprados').classList.toggle('active', filtro === 'comprados');
      renderizarProductos();
    }

    function actualizarPresupuestoYProgreso(lista) {
      let gastado = 0;
      let total = 0;
      let compradosCount = 0;
      const totalItems = lista.items.length;

      lista.items.forEach(item => {
        const subtotal = item.cantidad * Math.round(item.precio || 0);
        total += subtotal;
        if (item.comprado) {
          gastado += subtotal;
          compradosCount++;
        }
      });

      document.getElementById('valGastado').textContent = formatoCLP.format(gastado);
      document.getElementById('valTotal').textContent = formatoCLP.format(total);

      const pct = totalItems > 0 ? Math.round((compradosCount / totalItems) * 100) : 0;
      document.getElementById('txtProgresoEstado').textContent = `${compradosCount} de ${totalItems} productos en el carro`;
      document.getElementById('txtProgresoPorcentaje').textContent = `${pct}%`;
      document.getElementById('fillProgreso').style.width = `${pct}%`;
    }

    function renderizarProductos() {
      const contenedor = document.getElementById('contenedorProductosCategorizados');
      const titulo = document.getElementById('tituloListaActiva');
      contenedor.innerHTML = "";

      const lista = coleccionListas.find(l => l.id === idListaActiva);
      if (!lista) return;

      titulo.textContent = lista.nombre;
      actualizarPresupuestoYProgreso(lista);

      const filtrados = lista.items.filter(item => 
        filtroProductos === 'pendientes' ? !item.comprado : item.comprado
      );

      if (filtrados.length === 0) {
        contenedor.innerHTML = `<p class="empty-msg">${filtroProductos === 'pendientes' ? '¡Todo comprado!' : 'No hay productos comprados.'}</p>`;
        return;
      }

      CATEGORIAS.forEach((cat, index) => {
        const itemsDeCat = filtrados.filter(i => (i.categoriaId || clasificarProducto(i.texto).id) === cat.id);

        if (itemsDeCat.length > 0) {
          const header = document.createElement('div');
          header.className = 'category-header';
          header.innerHTML = `
            <div class="category-title">
              <span>${cat.icono}</span> <span>${cat.nombre}</span>
            </div>
            <div class="category-nav-btns">
              <button class="btn-cat-order" onclick="moverCategoria(${index}, -1)" title="Subir pasillo">▲</button>
              <button class="btn-cat-order" onclick="moverCategoria(${index}, 1)" title="Bajar pasillo">▼</button>
            </div>
          `;
          contenedor.appendChild(header);

          const ul = document.createElement('ul');

          itemsDeCat.forEach(item => {
            const li = document.createElement('li');
            const subtotal = item.cantidad * (item.precio || 0);

            li.innerHTML = `
              <div class="item-details ${item.comprado ? 'comprado' : ''}" onclick="cambiarEstadoProducto(${item.id})">
                <div class="item-name">${escapeHtml(item.texto)}</div>
                <div class="item-subtext">${subtotal > 0 ? `Subtotal: ${formatoCLP.format(subtotal)}` : 'Sin precio'}</div>
              </div>
              
              <input type="number" class="inline-price" value="${item.precio || ''}" placeholder="$ CLP" 
                     onchange="actualizarPrecioProducto(${item.id}, this.value)" title="Precio CLP">

              <div class="qty-controls">
                <button class="btn-qty" onclick="cambiarCantidadProducto(${item.id}, -1)">-</button>
                <span>${item.cantidad}</span>
                <button class="btn-qty" onclick="cambiarCantidadProducto(${item.id}, 1)">+</button>
              </div>
              <button class="btn-delete" onclick="eliminarProducto(${item.id})">✕</button>
            `;
            ul.appendChild(li);
          });

          contenedor.appendChild(ul);
        }
      });
    }

    function guardarStorage() { localStorage.setItem('misListasCompras_v1', JSON.stringify(coleccionListas)); }
    function cargarStorage() {
      const datos = localStorage.getItem('misListasCompras_v1');
      if (datos) { try { coleccionListas = JSON.parse(datos); } catch (e) { coleccionListas = []; } }
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
    }

    document.getElementById('nombreNuevaLista').addEventListener('keypress', e => { if (e.key === 'Enter') crearNuevaLista(); });
    ['itemInput', 'itemQty', 'itemPrice'].forEach(id => {
      document.getElementById(id).addEventListener('keypress', e => { if (e.key === 'Enter') agregarProducto(); });
    });
  </script>

      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')

          .catch((err) => console.log('Error registro SW:', err));
